name: Build Android

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dobby 的 Android 后端目前只有 arm / arm64，没有 x86 后端
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Configure
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S . -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDobby_BUILD_TESTS=OFF \
            -DDobby_BUILD_SAMPLES=OFF

      - name: Build
        run: cmake --build build-${{ matrix.abi }} --config Release -j "$(nproc)"

      - name: Show built libraries
        run: |
          find build-${{ matrix.abi }} \( -name "*.a" -o -name "*.so" \) -print | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dobby-android-${{ matrix.abi }}
          path: |
            build-${{ matrix.abi }}/**/*.a
            build-${{ matrix.abi }}/**/*.so
          if-no-files-found: error
